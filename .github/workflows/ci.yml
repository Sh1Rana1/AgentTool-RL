name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate example scenarios
        run: python scripts/validate_examples.py
      - name: Verify generated dataset
        run: python scripts/verify_dataset.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run baseline smoke evaluation
        run: python scripts/evaluate_baselines.py --agents random,rule --dataset data/examples/scenarios.jsonl --output artifacts/ci-baselines.json
